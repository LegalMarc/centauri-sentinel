name: Build and push obico-ml image

on:
  workflow_dispatch:
  push:
    paths:
      - 'docker/obico-ml/**'
    branches: ['main']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push obico-ml (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: ./docker/obico-ml
          push: true
          tags: |
            ghcr.io/legalmarc/centauri-sentinel/obico-ml:${{ github.sha }}
            ghcr.io/legalmarc/centauri-sentinel/obico-ml:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
